[project]
name = "ca-podchaser-tester"
version = "0.1.0"
description = ""
authors = [
    {name = "Otis Lin",email = "olin@quid.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[tool.poetry]
packages = [{include = "ca_podchaser_tester", from = "src"}]

[tool.poetry.scripts]
podchaser-dl = "ca_podchaser_tester.cli:main"
verify-transcript = "ca_podchaser_tester.cli_verify_transcript:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
